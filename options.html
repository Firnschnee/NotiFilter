<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NotiFilter</title>
  <style>
    body { font: 13px system-ui, sans-serif; margin: 12px; min-width: 360px; }
    fieldset { border: 1px solid #ccc; border-radius: 4px; margin: 0 0 12px; padding: 8px 12px; }
    legend { font-weight: 600; }
    label { display: block; margin: 4px 0; }
    input[type=number] { width: 4em; }
    .hint { color: #666; font-size: 12px; margin-top: 8px; }
    #status { color: #2a7; font-size: 12px; height: 1em; }
  </style>
</head>
<body>
  <fieldset>
    <legend>Notify for</legend>
    <div id="accounts"></div>
  </fieldset>
  <fieldset>
    <legend>Options</legend>
    <label><input type="checkbox" id="inboxOnly"> Inbox only (no subfolders)</label>
    <label><input type="checkbox" id="skipJunk"> Ignore junk</label>
    <label>One toast per mail up to <input type="number" id="maxIndividual" min="1" max="20"> mails, one summary toast above that</label>
  </fieldset>
  <div id="status"></div>
  <p class="hint">Turn off Thunderbird's own alert: Settings › General › "When new messages arrive" › untick "Show an alert". Otherwise every mail shows up twice.</p>
  <script src="options.js"></script>
</body>
</html>
